# Release builds: `git tag v1.2.3 && git push --tags` runs
# .github/workflows/release.yml, which runs goreleaser with this file.
# Try it locally with `goreleaser release --snapshot --clean`.
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/dcyber-lab/mad/internal/cli.Version={{.Version}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^ci:"
      - "^test:"

release:
  draft: false
  prerelease: auto

# Pushes Formula/mad.rb to dcyber-lab/homebrew-tap. Needs the
# HOMEBREW_TAP_TOKEN secret: a token with contents write access to that repo.
brews:
  - repository:
      owner: dcyber-lab
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: https://github.com/dcyber-lab/mad
    description: Run Claude Code, Codex, pi and shells side by side in one tmux deck
    license: MIT
    dependencies:
      - name: tmux
    install: |
      bin.install "mad"
    test: |
      assert_match "mad ", shell_output("#{bin}/mad version")
