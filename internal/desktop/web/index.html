<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mad</title>
<link rel="stylesheet" href="vendor/xterm.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <header>
      <span class="logo">mad</span>
      <span id="conn" class="conn" title="connection to mad"></span>
    </header>
    <div id="quota"></div>
    <nav id="projects"></nav>
  </aside>
  <div id="resizer" title="drag to resize"></div>
  <main>
    <div id="bar" hidden>
      <div id="tabs"></div>
      <div id="views" hidden>
        <button type="button" data-view="chat" title="its conversation, from its transcript (Alt-t)">Chat</button>
        <button type="button" data-view="term" title="its own TUI, attached to its pane (Alt-t)">Terminal</button>
      </div>
    </div>
    <div id="terms">
      <div id="empty">
        <p>Pick an agent on the left.</p>
        <p class="muted">Its conversation opens here, read from its transcript; <kbd>Alt</kbd>+<kbd>t</kbd>
          switches to its own TUI, attached to the same tmux pane the terminal deck shows.
          <kbd>Alt</kbd>+<kbd>n</kbd> jumps to the next agent that needs you.</p>
      </div>
    </div>
    <section id="queue" hidden>
      <div id="qerr"></div>
      <ol id="qitems"></ol>
      <div class="qbar">
        <textarea id="qinput" rows="1" placeholder="Queue a message: it is typed in when the agent's turn is over. Enter adds, Shift-Enter starts a new line."></textarea>
        <button id="qpause" type="button" title="hold the queued messages">Pause</button>
      </div>
    </section>
  </main>
</div>
<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<script src="vendor/marked.js"></script>
<script src="vendor/purify.js"></script>
<script src="app.js"></script>
</body>
</html>
