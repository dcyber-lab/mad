<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mad</title>
<link rel="stylesheet" href="vendor/xterm.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <header>
      <span class="logo">mad</span>
      <span id="conn" class="conn" title="connection to mad"></span>
    </header>
    <div id="quota"></div>
    <nav id="projects"></nav>
  </aside>
  <div id="resizer" title="drag to resize"></div>
  <main>
    <div id="tabs"></div>
    <div id="terms">
      <div id="empty">
        <p>Pick an agent on the left.</p>
        <p class="muted">Its real TUI opens here, attached to the same tmux pane the terminal deck shows.
          <kbd>Alt</kbd>+<kbd>n</kbd> jumps to the next agent that needs you.</p>
      </div>
    </div>
  </main>
</div>
<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<script src="app.js"></script>
</body>
</html>
