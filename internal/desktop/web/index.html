<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="mad-build" content="">
<title>mad</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="mad">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131315" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="offline" role="status" hidden></div>
<div id="app">
  <aside id="sidebar">
    <header>
      <span class="brand" id="brand" title="今日" data-en-title="Today"><span class="mark">m</span><span class="mword">mad</span><span class="mname"></span></span>
      <span id="conn" class="conn" title="和 mad 的连接" data-en-title="Connection to mad"></span>
      <button id="boardbtn" type="button" class="icon-btn" title="任务看板 (Alt-B)" data-en-title="Board (Alt-B)"><span data-icon="todo"></span></button>
      <button id="searchbtn" type="button" class="icon-btn" title="搜索 agent" data-en-title="Search agents" aria-label="搜索"><span data-icon="search"></span></button>
      <button id="newchat" type="button" class="icon-btn" title="新对话 (⌘N)" data-en-title="New chat (⌘N)" aria-label="新建"><span data-icon="compose"></span></button>
      <button id="embed-menu" type="button" class="icon-btn" title="更多" data-en-title="More" aria-label="更多"><span data-icon="more"></span></button>
    </header>
    <label class="search">
      <span class="ico" data-icon="search"></span>
      <input id="filter" type="search" placeholder="搜索或跳转" data-en-ph="Search or jump" autocomplete="off" spellcheck="false">
      <kbd id="filterKey">⌘K</kbd>
    </label>
    <div id="chips" hidden></div>
    <nav id="projects"></nav>
    <footer>
      <button id="next" type="button" class="nextbtn" hidden></button>
      <button id="usageline" type="button" class="usageline" hidden></button>
      <button id="me" type="button" class="merow"><span class="me-pic"></span><span class="me-nm"></span><span class="me-go" data-en="Usage ›">用量 ›</span></button>
      <div class="foot">
        <span class="muted" id="summary"></span>
        <button id="addproject" type="button" class="icon-btn" title="添加项目" data-en-title="Add project"><span data-icon="folderplus"></span></button>
        <button id="skills" type="button" class="icon-btn" title="技能" data-en-title="Skills"><span data-icon="skill"></span></button>
        <button id="phone" type="button" class="icon-btn" title="在手机上" data-en-title="On your phone"><span data-icon="phone"></span></button>
        <button id="bell" type="button" class="icon-btn" title="这台设备上的通知" data-en-title="Notifications on this device"><span data-icon="bell"></span></button>
        <button id="theme" type="button" class="icon-btn" title="主题" data-en-title="Theme"></button>
      </div>
    </footer>
  </aside>
  <div id="resizer" title="拖动调整宽度" data-en-title="Drag to resize"></div>
  <main id="main">
    <div id="bar" hidden>
      <button id="back" type="button" class="icon-btn" title="回到列表" data-en-title="Back to the list"><span data-icon="left"></span></button>
      <div id="ptitle"></div>
      <div id="tabs"></div>
      <div id="acts" hidden>
        <div id="seg" class="seg" hidden>
          <button type="button" data-v="chat" data-en="Chat">对话</button>
          <button type="button" data-v="diff" data-en="Changes">改动</button>
        </div>
        <button id="changes" type="button" class="bar-btn" title="它在目录里改了什么" data-en-title="What it changed in its directory"><span data-icon="diff"></span><span data-en="Changes">改动</span></button>
        <button id="details" type="button" class="icon-btn" title="详情 ⌘I" data-en-title="Details ⌘I" aria-label="详情"><span data-icon="sidepanel"></span></button>
        <button id="more" type="button" class="icon-btn" title="更多" data-en-title="More"><span data-icon="more"></span></button>
      </div>
    </div>
    <div id="body">
      <div id="center">
        <div id="terms">
          <div id="empty">
            <div class="hero">
              <div class="mark big">m</div>
              <h1 data-en="All your agents, in one place">你的 agent，都在这里</h1>
              <p class="muted" data-en="Start a new chat, or pick an agent on the left: it runs here, what it writes shows as it writes, and you answer what it asks right here.">开一段新对话，或者在左边选一个 agent：它就在这里运行，
                写的内容边写边显示，它的提问也在这里直接回答。</p>
              <button id="emptynew" type="button" class="btn primary" data-en="New chat">新对话</button>
            </div>
            <div id="home" hidden></div>
            <div class="keys muted">
              <span><kbd>⌘</kbd> <kbd>N</kbd> <span data-en="New chat">新对话</span></span>
              <span><kbd>Alt</kbd> <kbd>N</kbd> <span data-en="Next waiting">下一个在等你的</span></span>
              <span><kbd>⌘</kbd> <kbd>K</kbd> <span data-en="Search">搜索</span></span>
            </div>
          </div>
          <section id="chanview" hidden>
            <div id="chanhead"></div>
            <div id="chanscroll"><div id="chanlog" class="log"></div></div>
          </section>
          <section id="skillview" hidden></section>
          <section id="boardview" hidden></section>
          <section id="usageview" hidden></section>
          <section id="new" hidden>
            <div class="newhead">
              <h1 id="newtitle" data-en="What would you like to do?">想做点什么？</h1>
              <p id="newsub" class="muted"></p>
            </div>
          </section>
        </div>
        <section id="queue" hidden>
          <div class="composer">
            <ul id="qmenu" hidden></ul>
            <div id="qtodo" hidden></div>
            <div id="qerr"></div>
            <div id="qreply" hidden></div>
            <ol id="qitems"></ol>
            <div id="qimgs"></div>
            <textarea id="qinput" rows="1" placeholder="发消息给 agent，输入 / 用命令" data-en-ph="Message the agent, type / for commands"></textarea>
            <div class="cbar">
              <button id="attach" type="button" class="icon-btn" title="添加图片（也可以直接粘贴）" data-en-title="Add pictures (or paste them)"><span data-icon="attach"></span></button>
              <span id="who"></span>
              <span class="grow"></span>
              <span id="hint" class="hintline muted">它忙完后发送 · <kbd>⇧</kbd><kbd>↵</kbd> 换行</span>
              <button id="qpause" type="button" class="icon-btn" title="暂停排队的消息" data-en-title="Pause queued messages"></button>
              <button id="qsend" type="button" class="send" title="发送 (Enter)" data-en-title="Send (Enter)" disabled></button>
            </div>
            <input id="imgpick" type="file" accept="image/*" multiple hidden>
          </div>
        </section>
        <div id="past" hidden></div>
      </div>
      <aside id="side" hidden></aside>
      <aside id="insp" hidden></aside>
    </div>
  </main>
</div>
<div id="chpanel" hidden>
  <div class="chscrim"></div>
  <aside class="chside" role="dialog" aria-modal="true" aria-label="群信息"></aside>
</div>
<ul id="popup" class="popup" hidden></ul>
<div id="dialog" hidden></div>
<div id="toasts"></div>
<script src="i18n.js"></script>
<script src="vendor/marked.js"></script>
<script src="vendor/purify.js"></script>
<script src="icons.js"></script>
<script src="tools.js"></script>
<script src="inbox.js"></script>
<script src="pair.js"></script>
</body>
</html>
