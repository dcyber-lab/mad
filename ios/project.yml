name: mad
options:
  bundleIdPrefix: dev.mad
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  MadKit:
    path: MadKit
  MadUI:
    path: MadUI
targets:
  mad:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: MadKit
      - package: MadUI
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: mad
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSCameraUsageDescription: mad scans the QR code on your Mac to pair with it.
    # No entitlements file on purpose: a free Apple ID cannot have Push
    # Notifications (aps-environment), and asking for it makes signing fail.
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: $(MAD_BUNDLE_ID)
        PRODUCT_NAME: mad
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
  # The Mac app: SwiftUI, shares MadKit and MadUI with the iPhone app. Signed to run locally
  # (ad hoc), not sandboxed: it reads mad's state directory and starts the mad it finds.
  madmac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources: [MacApp]
    dependencies:
      - package: MadKit
      - package: MadUI
    info:
      path: MacApp/Info.plist
      properties:
        CFBundleDisplayName: mad
        LSMinimumSystemVersion: "14.0"
        NSPrincipalClass: NSApplication
        LSApplicationCategoryType: public.app-category.developer-tools
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MAD_BUNDLE_ID).mac
        PRODUCT_NAME: madmac
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
  madUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: mad
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: mad
        PRODUCT_BUNDLE_IDENTIFIER: $(MAD_BUNDLE_ID).uitests
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  madmac:
    build:
      targets:
        madmac: all
  mad:
    build:
      targets:
        mad: all
  madUITests:
    build:
      targets:
        mad: all
        madUITests: [test]
    test:
      targets: [madUITests]
