<title>mad 界面 v5</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a review column, then the Mac window at full size (scaled to fit), then three phones, then the rules.
   Tokens follow the app's own (internal/desktop/web/style.css); what changes is marked in the review. */
:root {
  --bg: #f4f4f6;
  --paper: #ffffff;
  --side: #f7f7f8;
  --raise: #efeff2;
  --raise-2: #e6e6ea;
  --line: rgba(15, 15, 22, .08);
  --line-2: rgba(15, 15, 22, .14);
  --fg: #111114;
  --fg-2: #50505a;
  --fg-3: #6b6b76;          /* was #8e8e98: 3.1:1 on the sidebar, now 5.0:1 */
  --accent: #2563eb;
  --mine: #e9f0fe;
  --mine-fg: #0f2a66;
  --wait: #c26a04;
  --wait-bg: #fff4e5;
  --work: #15803d;
  --work-bg: #e9f7ee;
  --done: #2563eb;
  --done-bg: #ebf1fe;
  --idle: #a1a1aa;
  --danger: #c62828;
  --code: #f6f6f8;
  --term: #15151a;
  --term-fg: #d6d6de;
  --add: #e6f6ea; --add-fg: #166534;
  --del: #fdecec; --del-fg: #9f1239;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 12px 40px rgba(0,0,0,.10);
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --mono: "SF Mono", ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b0b0d; --paper: #151517; --side: #101012; --raise: #1f1f23; --raise-2: #2a2a2f;
  --line: rgba(255,255,255,.07); --line-2: rgba(255,255,255,.13);
  --fg: #ececf1; --fg-2: #b0b0ba; --fg-3: #8a8a95; --accent: #7cacf8;
  --mine: #1c2a44; --mine-fg: #dbe6ff;
  --wait: #fbbf24; --wait-bg: #2e2410; --work: #4ade80; --work-bg: #10291a; --done: #60a5fa; --done-bg: #14223a;
  --idle: #5f5f68; --danger: #f87171; --code: #0f0f11; --term: #08080a; --term-fg: #d6d6de;
  --add: #0f2a18; --add-fg: #86efac; --del: #2e1216; --del-fg: #fda4af;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 40px rgba(0,0,0,.5); color-scheme: dark; } }
:root[data-theme="dark"], .force-dark {
  --bg: #0b0b0d; --paper: #151517; --side: #101012; --raise: #1f1f23; --raise-2: #2a2a2f;
  --line: rgba(255,255,255,.07); --line-2: rgba(255,255,255,.13);
  --fg: #ececf1; --fg-2: #b0b0ba; --fg-3: #8a8a95; --accent: #7cacf8;
  --mine: #1c2a44; --mine-fg: #dbe6ff;
  --wait: #fbbf24; --wait-bg: #2e2410; --work: #4ade80; --work-bg: #10291a; --done: #60a5fa; --done-bg: #14223a;
  --idle: #5f5f68; --danger: #f87171; --code: #0f0f11; --term: #08080a; --term-fg: #d6d6de;
  --add: #0f2a18; --add-fg: #86efac; --del: #2e1216; --del-fg: #fda4af;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 40px rgba(0,0,0,.5); color-scheme: dark;
}
* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--fg); font: 14px/1.55 var(--sans); }
.page { max-width: 1240px; margin: 0 auto; padding-block: 40px 80px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 56px; }
h1, h2, h3 { text-wrap: balance; margin: 0 }
h1 { font-size: 30px; letter-spacing: -.02em; line-height: 1.2 }
h2 { font-size: 21px; letter-spacing: -.01em }
h3 { font-size: 15px }
p { margin: 0; max-width: 68ch }
.eyebrow { font-size: 12px; letter-spacing: .06em; color: var(--fg-3); font-weight: 600 }
.lede { color: var(--fg-2); font-size: 15px }
.top { display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: end; justify-content: space-between }
.top > div { display: grid; gap: 8px; min-width: 0 }
.seg { display: inline-flex; background: var(--raise); border-radius: 9px; padding: 2px; gap: 2px }
.seg button { border: 0; background: none; font: inherit; font-size: 13px; color: var(--fg-2); padding: 4px 12px; border-radius: 7px; cursor: pointer }
.seg button[aria-pressed="true"] { background: var(--paper); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08) }
button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
section { display: grid; gap: 20px; min-width: 0 }
.sec-head { display: grid; gap: 6px }

/* ---------- review ---------- */
.verdict { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; display: grid; gap: 10px }
.verdict b { font-weight: 600 }
.findings { display: grid; gap: 0; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; overflow: hidden }
.f { display: grid; grid-template-columns: 52px minmax(0, 1fr) minmax(0, 1fr); gap: 16px; padding: 14px 18px; border-top: 1px solid var(--line) }
.f:first-child { border-top: 0 }
.f.head { background: var(--raise); font-size: 12px; color: var(--fg-3); font-weight: 600; padding-block: 8px }
.sev { font-size: 12px; font-weight: 600; border-radius: 6px; padding: 1px 8px; justify-self: start; height: fit-content }
.sev.h { background: var(--del); color: var(--del-fg) } .sev.m { background: var(--wait-bg); color: var(--wait) } .sev.l { background: var(--raise); color: var(--fg-2) }
.f h3 { font-size: 14px; margin-bottom: 2px }
.f p { color: var(--fg-2); font-size: 13px }
.f .fix { font-size: 13px; color: var(--fg) }
.now { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px }
.now figure { margin: 0; display: grid; gap: 6px }
.now img { border-radius: 10px; border: 1px solid var(--line); display: block; width: 100%; aspect-ratio: 16/10; object-fit: cover; object-position: top left; background: var(--paper) }
.now figcaption { font-size: 12px; color: var(--fg-3) }

/* ---------- mockup shared ---------- */
.stage { width: 100%; overflow: hidden; position: relative }
.scaler { transform-origin: top left; width: 1200px }
.mono { font-family: var(--mono) }
.av { flex: none; display: block; position: relative }
.av svg { display: block; overflow: visible }
.ring-spin { animation: spin 1.4s linear infinite; transform-origin: center; transform-box: fill-box }
@keyframes spin { to { transform: rotate(360deg) } }
@media (prefers-reduced-motion: reduce) { .ring-spin { animation: none } }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; border-radius: 6px; padding: 0 6px; height: 19px; white-space: nowrap; font-weight: 500 }
.pill.wait { background: var(--wait-bg); color: var(--wait) } .pill.work { background: var(--work-bg); color: var(--work) }
.pill.done { background: var(--done-bg); color: var(--done) } .pill.idle { background: var(--raise); color: var(--fg-3) }
.btn { border: 1px solid var(--line-2); background: var(--paper); color: var(--fg); font: inherit; font-size: 12.5px; border-radius: 8px; padding: 3px 10px; cursor: pointer; white-space: nowrap }
.btn.pri { background: var(--fg); color: var(--paper); border-color: transparent }
.btn.ghost { border-color: transparent; background: var(--raise) }
.btn.sm { font-size: 11.5px; padding: 1px 8px; border-radius: 6px }
kbd { font: 10.5px var(--mono); border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--fg-3); background: var(--paper) }

/* ---------- Mac window ---------- */
.win { width: 1200px; height: 760px; background: var(--paper); border-radius: 14px; box-shadow: var(--shadow); border: 1px solid var(--line-2);
  display: grid; grid-template-columns: 284px minmax(0, 1fr) auto; overflow: hidden; position: relative; font-size: 13.5px }
.sb { background: var(--side); border-right: 1px solid var(--line); display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; min-height: 0 }
.sb-top { display: flex; align-items: center; gap: 8px; padding: 14px 14px 6px }
.lights { display: flex; gap: 8px } .lights i { width: 12px; height: 12px; border-radius: 50%; display: block }
.lights i:nth-child(1) { background: #ff5f57 } .lights i:nth-child(2) { background: #febc2e } .lights i:nth-child(3) { background: #28c840 }
.mach { margin-left: auto; font-size: 12px; color: var(--fg-2); background: var(--raise); border-radius: 999px; padding: 2px 10px; white-space: nowrap; border: 0; font-family: inherit; cursor: pointer }
.search { margin: 8px 12px 6px; display: flex; align-items: center; gap: 8px; background: var(--raise); border-radius: 9px; padding: 6px 10px; color: var(--fg-3); cursor: pointer; border: 0; font: inherit; font-size: 13px; text-align: left }
.search span { flex: 1 }
.sb-list { overflow: auto; padding: 4px 8px 12px; display: grid; align-content: start; gap: 1px }
.grp { display: flex; align-items: center; gap: 6px; padding: 14px 8px 4px; font-size: 11.5px; color: var(--fg-3); font-weight: 600 }
.grp .n { font-weight: 500 }
.grp .meta { margin-left: auto; font-weight: 500; display: flex; gap: 8px; font-variant-numeric: tabular-nums }
.grp.att { color: var(--wait) }
.row { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 10px; cursor: pointer; border: 0; background: none; font: inherit; color: inherit; text-align: left; width: 100% }
.row:hover { background: var(--raise) }
.row[aria-current="true"] { background: var(--paper); box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 0 0 1px var(--line) }
.row .txt { min-width: 0; flex: 1; display: grid }
.row .nm { font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13.5px }
.row .sub { font-size: 12px; color: var(--fg-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.row .sub b { color: var(--fg-2); font-weight: 550 }
.row .end { display: grid; justify-items: end; gap: 2px; font-size: 11px; color: var(--fg-3); font-variant-numeric: tabular-nums }
.row.dim .nm, .row.dim .sub { opacity: .55 }
.att-card { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; display: grid; gap: 6px; cursor: pointer }
.att-card .cmd { font: 11.5px var(--mono); color: var(--fg-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--code); border-radius: 6px; padding: 3px 7px }
.att-card .acts { display: flex; gap: 6px; align-items: center }
.att-card .acts kbd { margin-left: auto }
.sb-foot { border-top: 1px solid var(--line); padding: 6px 8px 8px; display: grid; gap: 8px }
.me-pic { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, #f59e0b, #ef4444); color: #fff; display: grid; place-items: center; font-size: 13px; font-weight: 600; flex: none }
.quota { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px }
.q { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px }
.q .top2 { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--fg-2) }
.q .top2 span:last-child { color: var(--fg-3); font-variant-numeric: tabular-nums }
.q .big { font-size: 24px; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1.1 }
.qbar { height: 6px; background: var(--raise-2); border-radius: 6px; overflow: hidden }
.qbar i { display: block; height: 100%; background: var(--fg-2); border-radius: 6px }
.qbar i.hot { background: var(--wait) }
.me { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 550 }
.me .pic { width: 24px; height: 24px; border-radius: 50%; background: linear-gradient(135deg, #f59e0b, #ef4444); color: #fff; display: grid; place-items: center; font-size: 12px }
.me .spend { margin-left: auto; font-weight: 500; color: var(--fg-2); font-variant-numeric: tabular-nums; font-size: 12px }
.meter { display: grid; grid-template-columns: 58px minmax(0, 1fr) 64px; gap: 8px; align-items: center; font-size: 11px; color: var(--fg-3); font-variant-numeric: tabular-nums }
.meter .bar { height: 4px; background: var(--raise-2); border-radius: 4px; overflow: hidden }
.meter .bar i { display: block; height: 100%; background: var(--fg-2); border-radius: 4px }
.meter .bar i.hot { background: var(--wait) }
.meter span:last-child { text-align: right }

.main { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-width: 0; min-height: 0; background: var(--paper) }
.mh { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); min-height: 60px }
.mh .t { min-width: 0; display: grid }
.mh .t b { font-size: 15px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.mh .t span { font-size: 12px; color: var(--fg-3); white-space: nowrap; display: flex; gap: 6px; align-items: center }
.mh .right { margin-left: auto; display: flex; gap: 8px; align-items: center }
.icon-btn { width: 30px; height: 30px; border-radius: 8px; border: 0; background: none; color: var(--fg-2); display: grid; place-items: center; cursor: pointer }
.icon-btn:hover, .icon-btn[aria-pressed="true"] { background: var(--raise); color: var(--fg) }
.body { overflow: auto; min-height: 0 }
.col { max-width: 760px; margin: 0 auto; padding: 22px 28px 28px; display: grid; gap: 16px; align-content: start }

/* today */
.today-h { display: grid; gap: 4px }
.today-h h2 { font-size: 22px }
.today-h p { color: var(--fg-2); font-size: 13.5px }
.today-h p b { font-weight: 600 }
.block { display: grid; gap: 8px }
.block-h { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; color: var(--fg-2) }
.block-h .k { margin-left: auto; font-weight: 400; color: var(--fg-3); display: flex; gap: 4px; align-items: center; font-size: 11.5px }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none }
.dot.wait { background: var(--wait) } .dot.work { background: var(--work) } .dot.done { background: var(--done) } .dot.idle { background: var(--idle) }
.task { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper) }
.task.wait { border-color: color-mix(in srgb, var(--wait) 35%, var(--line)); background: color-mix(in srgb, var(--wait-bg) 45%, var(--paper)) }
.task .tt { display: grid; gap: 3px; min-width: 0 }
.task .tt b { font-weight: 600; font-size: 13.5px }
.task .tt .where { font-size: 12px; color: var(--fg-3) }
.task .cmd { font: 12px var(--mono); background: var(--code); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; margin-top: 4px; overflow-x: auto; white-space: nowrap }
.task .acts { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap }
.task .side { font-size: 11.5px; color: var(--fg-3); text-align: right; font-variant-numeric: tabular-nums; display: grid; gap: 4px; justify-items: end }
.lines { border: 1px solid var(--line); border-radius: 12px; overflow: hidden }
.line { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 9px 14px; border-top: 1px solid var(--line); cursor: pointer }
.line:first-child { border-top: 0 }
.line:hover { background: var(--raise) }
.line .tt { min-width: 0; display: grid }
.line .tt b { font-weight: 550; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.line .tt span { font-size: 12px; color: var(--fg-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.line .tt span code { font: 11.5px var(--mono); color: var(--fg-2) }
.line .num { font-size: 12px; color: var(--fg-3); font-variant-numeric: tabular-nums }
.quiet { font-size: 12.5px; color: var(--fg-3); padding: 2px 2px }
.keys { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; font-size: 11.5px; color: var(--fg-3); padding-top: 6px }
.keys span { display: flex; gap: 3px; align-items: center }

/* agent */
.tabs { display: inline-flex; background: var(--raise); border-radius: 9px; padding: 2px; gap: 2px }
.tabs button { border: 0; background: none; font: inherit; font-size: 12.5px; color: var(--fg-2); padding: 3px 12px; border-radius: 7px; cursor: pointer; display: flex; gap: 5px; align-items: center }
.tabs button[aria-selected="true"] { background: var(--paper); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08) }
.tabs .c { font-size: 11px; color: var(--fg-3); font-variant-numeric: tabular-nums }
.msg-me { justify-self: end; background: var(--mine); color: var(--mine-fg); padding: 8px 14px; border-radius: 16px 16px 4px 16px; max-width: 72% }
.msg-ai { display: grid; gap: 8px; max-width: 100% }
.msg-ai ul { margin: 0; padding-left: 20px }
.msg-ai code { font: 12px var(--mono); background: var(--code); padding: 1px 5px; border-radius: 4px; border: 1px solid var(--line) }
.tools { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; font-size: 12.5px }
.tool { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-top: 1px solid var(--line); min-width: 0 }
.tool:first-child { border-top: 0 }
.tool b { font-weight: 600; flex: none }
.tool .arg { font-family: var(--mono); font-size: 11.5px; color: var(--fg-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0 }
.tool .r { flex: none; font-size: 11.5px; font-variant-numeric: tabular-nums }
.tool .ok { color: var(--work) } .tool .bad { color: var(--danger) }
.tool-sum { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--fg-3); cursor: pointer; padding: 2px 0 }
.ask { border: 1px solid color-mix(in srgb, var(--wait) 45%, var(--line)); border-radius: 12px; overflow: hidden; background: var(--paper) }
.ask-h { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--wait-bg); color: var(--wait); font-size: 12.5px; font-weight: 600 }
.ask-h span { margin-left: auto; font-weight: 400; color: var(--fg-3); font-size: 11.5px }
.ask pre { margin: 0; padding: 10px 12px; font: 12.5px/1.5 var(--mono); overflow-x: auto; background: var(--code); border-bottom: 1px solid var(--line) }
.ask .acts { display: flex; gap: 8px; padding: 9px 12px; align-items: center; flex-wrap: wrap }
.ask .acts .hint { margin-left: auto; font-size: 11.5px; color: var(--fg-3); display: flex; gap: 4px; align-items: center }
.done-note { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--work); background: var(--work-bg); border-radius: 10px; padding: 8px 12px }
.comp { padding: 10px 24px 16px }
.comp-box { max-width: 760px; margin: 0 auto; border: 1px solid var(--line-2); border-radius: 16px; background: var(--paper); box-shadow: 0 2px 10px rgba(0,0,0,.04); padding: 10px 12px 8px; display: grid; gap: 8px }
.comp-box .ph { color: var(--fg-3); font-size: 13.5px; padding: 2px 4px }
.comp-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--fg-3) }
.comp-row .send { margin-left: auto; width: 28px; height: 28px; border-radius: 50%; background: var(--raise-2); color: var(--fg-3); display: grid; place-items: center; border: 0 }
.chip { display: inline-flex; align-items: center; gap: 5px; background: var(--raise); border-radius: 999px; padding: 1px 8px 1px 3px; font-size: 12px; color: var(--fg-2) }
.term { background: var(--term); color: var(--term-fg); font: 12.5px/1.6 var(--mono); border-radius: 12px; padding: 14px 16px; white-space: pre; overflow: auto; min-height: 420px }
.term .g { color: #4ade80 } .term .y { color: #fbbf24 } .term .d { color: #7d7d88 } .term .r { color: #f87171 }
.diff-files { display: grid; border: 1px solid var(--line); border-radius: 12px; overflow: hidden }
.df { display: flex; gap: 10px; padding: 8px 12px; border-top: 1px solid var(--line); font-size: 12.5px; align-items: center; cursor: pointer }
.df:first-child { border-top: 0 }
.df[aria-current="true"] { background: var(--raise) }
.df .p { font-family: var(--mono); font-size: 12px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.df .a { color: var(--add-fg) } .df .x { color: var(--del-fg) }
.hunk { border: 1px solid var(--line); border-radius: 12px; overflow: auto; font: 12px/1.65 var(--mono) }
.hunk div { padding: 0 12px; white-space: pre }
.hunk .hh { background: var(--raise); color: var(--fg-3); padding-block: 4px }
.hunk .add { background: var(--add); color: var(--add-fg) } .hunk .del { background: var(--del); color: var(--del-fg) }
.git-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--fg-2) }
.git-bar .sp { margin-left: auto }

/* inspector */
.insp { width: 0; overflow: hidden; border-left: 1px solid transparent; background: var(--side); transition: width .2s ease }
.insp.open { width: 272px; border-left-color: var(--line) }
.insp-in { width: 272px; padding: 16px; display: grid; gap: 18px; align-content: start; height: 100%; overflow: auto }
.kv { display: grid; gap: 8px; font-size: 12.5px }

      <div class="block"><div class="block-h">${S.budget}<span class="k">${S.budgetK}</span></div>
        <div class="qbar"><i style="width:34%"></i></div></div>
    </div></div>`;
  }

  function renderInsp() {
    const a = cur.type === 'agent' ? A[cur.id] : null;
    document.getElementById('insp').classList.toggle('open', !!(a && inspOpen));
    if (!a) return;
    const r = (k, v, cls) => `<div class="r"><span>${k}</span><span${cls ? ` class="${cls}"` : ''}>${v}</span></div>`;
    document.getElementById('inspIn').innerHTML = `
      <div class="kv"><h4>${S.iStatus}</h4>${r(S.iNow, S.st[a.st])}${r(S.iUp, S.min(23))}</div>
      <div class="kv"><h4>git</h4>${r(S.iBranch, 'main', 'mono')}${r(S.iChanges, S.iChangesV)}${r(S.iUnpushed, S.iUnpushedV)}
        <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm" type="button">${S.push}</button><button class="btn sm" type="button">${S.openPR}</button><button class="btn sm" type="button">${S.iRebase}</button></div></div>
      <div class="kv"><h4>${S.iCost}</h4>${r(S.iSession, a.cost || '—')}${r(S.iIO, '182k / 9.4k')}${r(S.iModel, 'Opus')}</div>
      <div class="kv"><h4>${S.iSess}</h4>${r('id', '6625f15d', 'mono')}${r(S.iDir, '~/src/mad', 'mono')}
        <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm" type="button">${S.iRename}</button><button class="btn sm" type="button">${S.iSleep}</button><button class="btn sm" type="button" style="color:var(--danger)">${S.iStop}</button></div></div>`;
  }

  function render() {
    renderSide();
    document.getElementById('meRow').setAttribute('aria-current', String(cur.type === 'usage'));
    main.innerHTML = cur.type === 'today' ? viewToday() : cur.type === 'usage' ? viewUsage() : cur.type === 'agent' ? viewAgent(cur.id) : viewChannel(cur.id);
    renderInsp();
  }

  // ================= phones =================
  function renderPhones() {
    const sb = `<div class="island"></div><div class="status-bar"><span>11:42</span><span style="font-size:13px">●●● ▮</span></div>`;
    const round = `background:var(--raise);border-radius:50%`;
    document.getElementById('ph1').innerHTML = sb + `
      <div class="ph-head"><div class="ttl"><h3>mad</h3><span class="ic"><span class="icon-btn" style="${round}"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="5"/><path d="m11 11 3.5 3.5"/></svg></span><span class="icon-btn" style="${round}">＋</span></span></div>
        <span class="mach" style="justify-self:start">${S.machine}</span></div>
      <div class="ph-body">
        <div class="grp att"><span class="dot wait"></span>${S.pending} 2</div>
        <div class="ph-att">
          <div class="att-card"><div style="display:flex;gap:8px;align-items:center">${av(2, 1, 'wait', 28)}<b style="flex:1;font-weight:600;font-size:15px">${L(A.table.name)}</b><span style="font-size:12px;color:var(--fg-3)">${S.min(4)}</span></div>
            <div class="cmd">$ python3 make_table.py --out report.xlsx</div>
            <div class="acts"><button class="btn pri" type="button">${S.allow}</button><button class="btn" type="button">${S.deny}</button><span style="margin-left:auto;font-size:12px;color:var(--fg-3)">mad</span></div></div>
          <div class="att-card"><div style="display:flex;gap:8px;align-items:center">${av(1, 0, 'wait', 28)}<b style="flex:1;font-weight:600;font-size:15px">kim</b><span style="font-size:12px;color:var(--fg-3)">${S.min(1)}</span></div>
            <div style="font-size:14px">${S.kimShort}</div></div>
        </div>
        <div class="grp">${S.groups}</div>
        <div class="row">${tile(CH.ios.members, 44)}<span class="txt"><span class="nm">ios</span><span class="sub">${L(CH.ios.sub)}</span></span><span class="end"><span class="pill" style="background:var(--accent);color:var(--paper)">3</span></span></div>
        <div class="row">${tile(CH.five.members, 44)}<span class="txt"><span class="nm">five</span><span class="sub">${L(CH.five.sub)}</span></span></div>
        <div class="grp">mad<span class="meta">${projMeta(PROJ[0])}</span></div>
        <div class="row">${av(5, 0, 'work', 44)}<span class="txt"><span class="nm">${L(A.tok.name)}</span><span class="sub"><b>Bash</b> go test ./internal/ui/...</span></span><span class="end">${S.min(6)}</span></div>
        <div class="row">${av(4, 0, 'done', 44)}<span class="txt"><span class="nm">Mad ideas</span><span class="sub">${L(A.ideas.sub)}</span></span></div>
      </div>
      <div class="ph-foot"><div class="row" style="padding:4px 2px"><span class="me-pic">H</span><span class="txt"><span class="nm" style="font-size:15px">Heng Du</span></span><span class="end" style="font-size:13px"><span>${S.usageEntry}</span></span></div></div>`;

    document.getElementById('ph2').innerHTML = sb + `
      <div class="ph-nav"><span class="back">‹</span>${av(2, 1, 'wait', 34)}<span class="t"><b>${L(A.table.name)}</b><span>claude · mad / main · $0.84</span></span><span class="icon-btn" style="margin-left:auto">${ICON_MORE}</span></div>
      <div class="ph-conv">
        <div class="ph-tabs" style="padding:0"><div class="tabs"><button type="button" aria-selected="true">${S.tabChat}</button><button type="button" aria-selected="false">${S.tabDiff} <span class="c">3</span></button></div></div>
        <div class="msg-me" style="max-width:82%">${S.meTable}</div>
        <div class="msg-ai"><p>${S.ai1}</p></div>
        <div class="tools"><div class="tool"><b>Read</b><span class="arg">board.json</span><span class="r ok">✓</span></div><div class="tool"><b>Run</b><span class="arg">go test ./internal/board/...</span><span class="r bad">✕</span></div></div>
        <div class="msg-ai"><p>${S.ai2} ${S.ai3}</p></div>
      </div>
      <div class="sheet"><div class="grab"></div><div style="display:flex;gap:8px;align-items:center;color:var(--wait);font-weight:600;font-size:14px">${S.askH}<span style="margin-left:auto;color:var(--fg-3);font-weight:400;font-size:12px">${S.waited}</span></div>
        <pre>$ python3 make_table.py --out report.xlsx</pre>
        <div class="acts"><button class="btn" type="button">${S.deny}</button><button class="btn pri" type="button">${S.allow}</button></div>
        <button class="btn ghost" type="button" style="padding:8px;font-size:14px;border-radius:12px">${S.allowPy}</button></div>`;

    document.getElementById('ph3').innerHTML = sb + `
      <div class="ph-nav"><span class="back">‹</span>${tile(CH.ios.members, 34)}<span class="t"><b>ios</b><span>${L(CH.ios.n)}</span></span><span class="members" style="margin-left:auto">${[M.architect, M.builder].map(m => av(m.c, m.s, 'work', 26)).join('')}</span></div>
      <div class="ph-conv">
        <div class="daysep">${S.todayAt}</div>
        <div class="mine-wrap"><div class="msg-me" style="max-width:85%">${atTag('architect', 1, 16)} ${atTag('builder', 3, 16)} ${S.ch1}</div><span class="rcpt">${av(1, 0, 'idle', 14)}${av(3, 1, 'idle', 14)}<span>${S.read}</span></span></div>
        <div class="cmsg">${av(1, 0, 'work', 30)}<div><div class="who"><b>architect</b>14:06</div><div class="txt" style="font-size:15px">${S.ch2a} ${atTag('builder', 3, 16)} ${S.ch2b}</div></div></div>
        <div class="fold">${S.chFoldShort}</div>
        <div class="cmsg">${av(4, 0, 'idle', 30)}<div><div class="who"><b>reviewer</b>14:40</div><div class="txt" style="font-size:15px">${S.ch3}</div></div></div>
        <div class="mine-wrap"><div class="msg-me" style="max-width:85%">${atTag('designer', 5, 16)} ${S.ch4Short}</div><span class="rcpt">${S.delivered}</span></div>
      </div>
      <div class="ph-comp"><span style="font-size:22px;color:var(--fg-3)">＋</span><span class="in">${S.composeCh('ios')}</span><span class="send">↑</span></div>`;
  }

  // ================= page chrome =================
  function renderChrome() {
    document.querySelectorAll('[data-i18n]').forEach(el => { const v = S[el.dataset.i18n]; if (typeof v === 'string') el.innerHTML = v; });
    document.getElementById('findings').innerHTML =
      `<div class="f head" role="row"><span>${S.fHead[0]}</span><span>${S.fHead[1]}</span><span>${S.fHead[2]}</span></div>` +
      S.findings.map(([s, h, p, fix]) => `<div class="f" role="row"><span class="sev ${s}">${S.sev[s]}</span><div><h3>${h}</h3><p>${p}</p></div><p class="fix">${fix}</p></div>`).join('');
    document.getElementById('states').innerHTML = ['wait', 'work', 'done', 'idle', 'stop']
      .map((s, i) => `<div class="st">${av([2, 5, 4, 6, 0][i], i % 2, s, 32)}<span class="pill ${s === 'stop' ? 'idle' : s}">${S.st[s]}</span><span>${S.stDesc[s]}</span></div>`).join('');
    const sizes = [['font-size:22px;font-weight:700'], ['font-size:15px;font-weight:700'], ['font-size:13.5px;font-weight:550'], ['font-size:12px;color:var(--fg-3)'], ['font-size:11px;color:var(--fg-3)']];
    document.getElementById('typeRows').innerHTML = S.typeRows.map(([t, k], i) => `<div class="type-row"><span style="${sizes[i]}">${t}</span><small>${k}</small></div>`).join('');
    document.getElementById('keepList').innerHTML = S.keep.map(x => `<li>${x}</li>`).join('');
    document.getElementById('plan').innerHTML = S.plan.map(([t, p, w], i) => `<div class="pr"><span class="no">${i + 1}</span><p><b>${t}</b>${lang === 'zh' ? '：' : ': '}${p}</p><span class="where">${w}</span></div>`).join('');
    const pin = document.getElementById('palIn'); pin.placeholder = S.palPh; pin.value = S.palQ;
    document.querySelector('#pal .pal').setAttribute('aria-label', S.search);
  }

  function renderAll() { renderChrome(); render(); renderPhones(); }

  // ================= events =================
  const win = document.getElementById('win');
  win.addEventListener('click', (e) => {
    if (e.target.closest('[data-approve]')) { approved = true; e.stopPropagation(); render(); return; }
    const t = e.target.closest('[data-tab]'); if (t) { tab = t.dataset.tab; render(); return; }
    if (e.target.closest('[data-insp]')) { inspOpen = !inspOpen; render(); return; }
    const g = e.target.closest('[data-go]');
    if (g && !e.target.closest('.pal')) {
      const [type, id] = g.dataset.go.split(':');
      cur = type === 'today' || type === 'usage' ? { type } : { type, id };
      if (type === 'agent') tab = 'chat';
      render();
    }
  });
  const pal = document.getElementById('pal');
  document.getElementById('openPal').addEventListener('click', (e) => {
    e.stopPropagation();
    document.getElementById('palRows').innerHTML = [['table', '⏎'], ['tok', ''], ['ideas', '']]
      .map(([id, k]) => { const a = A[id]; return `<button class="row" type="button" data-pal="${id}">${av(a.c, a.s, a.st, 24)}<span class="txt"><span class="nm">${L(a.name)}</span><span class="sub">${a.proj} · ${a.kind}</span></span><span class="end">${k ? `<kbd>${k}</kbd>` : ''}</span></button>`; }).join('');
    pal.hidden = false; document.getElementById('palIn').focus();
  });
  pal.addEventListener('click', (e) => {
    const r = e.target.closest('[data-pal]');
    if (r) { cur = { type: 'agent', id: r.dataset.pal }; tab = 'chat'; pal.hidden = true; render(); return; }
    if (e.target.closest('[data-pal-usage]')) { cur = { type: 'usage' }; pal.hidden = true; render(); return; }
    if (e.target === pal) pal.hidden = true;
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') pal.hidden = true; });

  // ================= scaling =================
  const stage = document.getElementById('macStage'), scaler = document.getElementById('macScaler');
  function fit() {
    const k = Math.min(1, stage.clientWidth / 1200);
    scaler.style.transform = `scale(${k})`; stage.style.height = (762 * k) + 'px';
    document.querySelectorAll('.phone-stage').forEach(ps => {
      const p = ps.querySelector('.phone'), kk = ps.clientWidth / 390;
      p.style.transform = `scale(${kk})`; ps.style.height = (844 * kk) + 'px';
    });
  }
  window.addEventListener('resize', fit);

  // ================= start =================
  const savedTheme = store('mad-v5-theme'); if (savedTheme) setTheme(savedTheme);
  const savedLang = store('mad-v5-lang');
  setLang(savedLang || ((navigator.language || 'zh').toLowerCase().startsWith('zh') ? 'zh' : 'en'));
  fit();
})();
</script>
