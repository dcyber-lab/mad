<script>
const COLORS = ["#8a3ffc", "#ff5a1f", "#1f66ff", "#ff4d8d", "#1fbf75", "#12b5d6", "#f5b324", "#6a5cff"];
function hash(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; } return h; }
function body(id, stopped) {
  const h = hash(id), col = COLORS[h % 8], round = (h >> 3) % 2 === 0;
  const shape = round ? `<circle cx="50" cy="50" r="40" fill="${col}"/>` : `<rect x="12" y="12" width="76" height="76" rx="26" fill="${col}" transform="rotate(-12 50 50)"/>`;
  const eyes = stopped ? [36, 60].map(x => `<rect x="${x - 7}" y="44" width="14" height="5" rx="2.5" fill="rgba(0,0,0,.75)"/>`).join("")
    : [36, 60].map(x => `<rect x="-3.5" y="-9" width="7" height="18" rx="3.5" fill="rgba(0,0,0,.78)" transform="translate(${x} 43) rotate(-16)"/>`).join("");
  return shape + eyes;
}
function avatar(id, size, ring) {
  const inner = ring === "wait" || ring === "work" ? `<g transform="translate(9 9) scale(.82)">${body(id, false)}</g>` : body(id, ring === "stop");
  let r = "";
  if (ring === "wait") r = `<circle cx="50" cy="50" r="46.5" fill="none" stroke="#e8890c" stroke-width="6"/>`;
  if (ring === "work") r = `<circle cx="50" cy="50" r="46.5" fill="none" stroke="#e5e5ea" stroke-width="5"/><g class="spin"><circle cx="50" cy="50" r="46.5" fill="none" stroke="#16a34a" stroke-width="6" stroke-linecap="round" stroke-dasharray="78 300"/></g>`;
  if (ring === "done") r = `<circle cx="86" cy="86" r="12" fill="#2563eb" stroke="#f7f7f8" stroke-width="6"/>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true" style="display:block;overflow:visible">${inner}${r}</svg>`;
}
const MEMBERS = { ios: ["team0001-arch", "team0001-bld0", "team0001-rev0"], five: ["kim-0001", "lee-0002", "park-0003", "five-04", "five-05"] };
function groupTile(name, size) {
  const m = MEMBERS[name] || [], s = size * .58;
  const spots = [[0, 0], [size - s, size * .05], [size * .2, size - s]];
  return `<div style="position:relative;width:${size}px;height:${size}px;flex:none">` + m.slice(0, 3).map((id, i) =>
    `<div style="position:absolute;left:${spots[i][0]}px;top:${spots[i][1]}px">${avatar(id, s)}</div>`).join("") + `</div>`;
}
document.querySelectorAll("[data-av]").forEach(el => { el.innerHTML = avatar(el.dataset.av, +(el.dataset.size || 26), el.dataset.ring); });
document.querySelectorAll("[data-group]").forEach(el => { el.innerHTML = groupTile(el.dataset.group, +(el.dataset.size || 26)); });
</script>
